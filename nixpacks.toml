[phases.setup]
aptPkgs = ["ffmpeg", "curl", "python3", "yt-dlp"]
# Latest yt-dlp binary (apt's version is too old for YouTube's bot check).
# /usr/local/bin comes before /usr/bin in PATH, so this one wins.
# If the download fails the build still continues with apt's yt-dlp.
cmds = ["curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && chmod +x /usr/local/bin/yt-dlp || echo 'yt-dlp binary download failed, using apt version'"]
